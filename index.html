<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Trilha de Onboarding — Executivo de Vendas · Podium Educação</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Identidade Podium — cores compartilhadas em todos os produtos */
    --gold: #D7AB5C;
    --night: #16273C;
    --ink: #0A1422;
    --light: #F2F2F2;
    /* exclusiva Podium e mentorias */
    --cream: #F8F1A5;

    /* O dourado da marca nao atinge contraste de leitura sobre fundo claro
       (fica em ~2:1), entao texto em fundo claro usa estas versoes. */
    --gold-deep: #7A5A17;
    --gold-pale: #F6EEDC;

    --navy: var(--night);
    --navy-light: #2E4A70;
    --navy-pale: #E4E8EE;
    --navy-mid: var(--gold);

    --amber: #BA7517;
    --amber-pale: #FAEEDA;
    --teal: #0E6E7D;
    --teal-pale: #E2F1F4;
    --red-pale: #FCEBEB;
    --red: #791F1F;
    --gray-50: #F2F2F2;
    --gray-100: #E8E8E8;
    --gray-200: #D8D8D8;
    --gray-400: #9A9A9A;
    --gray-600: #5A5A5A;
    --gray-800: #262626;
    --text: #141414;
    /* largura do miolo: perto das laterais no monitor, com folga no celular */
    --largura: 1440px;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--gray-50);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    min-height: 100vh;
  }

  /* TOP BAR */
  .topbar {
    background: var(--ink);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-logo {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: white;
    letter-spacing: 0.01em;
  }
  .topbar-logo span {
    color: var(--navy-mid);
  }

  /* HERO */
  .hero {
    background: var(--navy);
    padding: 3rem 2rem 4rem;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0; right: 0;
    height: 48px;
    background: var(--gray-50);
    border-radius: 48px 48px 0 0;
  }
  .hero-inner {
    max-width: var(--largura);
    margin: 0 auto;
  }
  .hero-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--navy-mid);
    margin-bottom: 12px;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 40px);
    color: white;
    line-height: 1.15;
    margin-bottom: 14px;
  }
  .hero-sub {
    font-size: 15px;
    color: rgba(255,255,255,0.65);
    line-height: 1.6;
    max-width: 62ch;
  }

  /* PROGRESS */
  .progress-section {
    max-width: var(--largura);
    margin: 2rem auto 0;
    padding: 0 2.5rem;
  }
  .progress-card {
    background: white;
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    border: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  .progress-text { flex: 1; }
  .progress-label {
    font-size: 13px;
    color: var(--gray-600);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 6px;
    background: var(--gray-100);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-count {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: var(--navy);
    white-space: nowrap;
    line-height: 1;
  }
  .progress-count span {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--gray-400);
    font-weight: 400;
  }

  /* STEPS */
  .steps-section {
    max-width: var(--largura);
    margin: 1.5rem auto 4rem;
    padding: 0 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .step {
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .step.is-done {
    border-color: var(--navy-light);
  }
  .step.is-open {
    box-shadow: 0 4px 20px rgba(10, 20, 34, 0.10);
  }

  .step-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .step-header:hover { background: var(--gray-50); }

  .step-num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    flex-shrink: 0;
    background: var(--gray-100);
    color: var(--gray-600);
    transition: all 0.25s;
  }
  .step.is-done .step-num {
    background: var(--navy-light);
    color: white;
  }

  .step-info { flex: 1; min-width: 0; }
  .step-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    transition: color 0.2s;
    line-height: 1.4;
  }
  .step.is-done .step-name {
    color: var(--gray-400);
    text-decoration: line-through;
  }
  .step-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-top: 4px;
  }
  .tag-must { background: var(--red-pale); color: var(--red); }
  .tag-watch { background: var(--teal-pale); color: var(--teal); }
  .tag-do { background: var(--gold-pale); color: var(--gold-deep); }
  .tag-soon { background: var(--amber-pale); color: var(--amber); }

  .step.is-locked {
    opacity: 0.55;
    background: var(--gray-100);
    border-style: dashed;
  }
  .step.is-locked .step-header { cursor: default; }
  .step.is-locked .step-chevron { visibility: hidden; }
  .step.is-locked .step-num {
    background: transparent;
    color: var(--gray-400);
    font-size: 13px;
  }
  .step-locked-hint {
    display: block;
    font-size: 11px;
    color: var(--gray-600);
    margin-top: 3px;
  }

  .trilha-tabs {
    display: flex;
    gap: 8px;
    margin: 0 auto 18px;
    max-width: var(--largura);
    padding: 0 2.5rem;
  }
  .trilha-tab {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-600);
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .trilha-tab:hover { border-color: var(--gold); }
  .trilha-tab.is-active {
    background: var(--night);
    border-color: var(--night);
    color: #fff;
  }
  .trilha-tab-count {
    font-size: 11px;
    font-weight: 500;
    background: var(--gray-100);
    color: var(--gray-600);
    border-radius: 20px;
    padding: 1px 7px;
  }
  .trilha-tab.is-active .trilha-tab-count {
    background: var(--gold);
    color: var(--ink);
  }

  .step-chevron {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gray-400);
    transition: transform 0.25s;
  }
  .step.is-open .step-chevron { transform: rotate(180deg); }

  .step-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .step-body-inner {
    padding: 0 16px 16px 62px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .step-desc {
    font-size: 13px;
    color: var(--gray-600);
    line-height: 1.7;
  }

  /* ---- Passo em formato de trilha: mapa de etapas + uma etapa por vez ---- */
  .mapa {
    display: flex;
    align-items: flex-start;
    gap: 0;
    margin: 4px 0 18px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .mapa-no {
    flex: 1 0 auto;
    min-width: 92px;
    background: none;
    border: 0;
    padding: 0;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    position: relative;
  }
  /* a linha que liga um no ao proximo */
  .mapa-no::before {
    content: "";
    position: absolute;
    top: 13px;
    left: -50%;
    width: 100%;
    height: 2px;
    background: var(--gray-200);
  }
  .mapa-no:first-child::before { display: none; }
  .mapa-no.is-feito::before { background: var(--gold); }
  .mapa-bolha {
    position: relative;
    z-index: 1;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--gray-200);
    color: var(--gray-400);
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mapa-rotulo {
    font-size: 10.5px;
    line-height: 1.3;
    color: var(--gray-600);
    text-align: center;
    max-width: 96px;
  }
  .mapa-no.is-feito .mapa-bolha { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .mapa-no.is-atual .mapa-bolha { background: var(--night); border-color: var(--night); color: #fff; transform: scale(1.12); }
  .mapa-no.is-atual .mapa-rotulo { color: var(--night); font-weight: 600; }

  .etapa-topo {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .etapa-contador {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-deep);
  }
  .etapa-nome {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    color: var(--night);
  }
  .etapa-nav {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    align-items: center;
  }
  .etapa-btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 15px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200);
    background: #fff;
    color: var(--gray-800);
    cursor: pointer;
  }
  .etapa-btn:hover:not(:disabled) { border-color: var(--gold); }
  .etapa-btn:disabled { opacity: 0.4; cursor: default; }
  .etapa-btn.is-principal { background: var(--night); border-color: var(--night); color: #fff; }
  .etapa-btn.is-principal:hover { background: var(--ink); border-color: var(--ink); }

  .etapa-recall {
    margin-top: 14px;
    border: 1px dashed var(--gray-200);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    background: var(--gray-50);
  }
  .etapa-recall p {
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--gray-600);
  }
  .etapa-recall strong { color: var(--night); }

  @media (max-width: 640px) {
    .mapa-no { min-width: 76px; }
    .mapa-rotulo { font-size: 9.5px; }
  }

  .falas {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .falas li {
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--gray-800);
    background: #fff;
    border-left: 2px solid var(--gold);
    border-radius: 0 6px 6px 0;
    padding: 7px 10px;
  }
  .fala-etiqueta {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin-bottom: 3px;
  }

  .step-links {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .step-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--navy);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.15s;
  }
  .step-link:hover { color: var(--navy-light); }
  .step-link-icon {
    width: 16px;
    height: 16px;
    background: var(--navy-pale);
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    flex-shrink: 0;
  }

  .sub-steps { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  .sub-step { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius-sm); padding: 10px 12px; }
  .sub-step-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .sub-step-order { font-size: 10px; font-weight: 500; background: var(--gold-pale); color: var(--gold-deep); border-radius: 20px; padding: 2px 8px; }
  .sub-step-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .sub-step-why { font-size: 12px; color: var(--gray-600); line-height: 1.6; margin-bottom: 4px; }
  .sub-step-result { font-size: 12px; color: var(--navy); font-weight: 500; }
  .sub-step-result::before { content: "→ "; }

  .snippet {
    margin-top: 14px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    background: #fff;
    overflow: hidden;
  }
  .snippet-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    background: var(--gray-100);
    border-bottom: 1px solid var(--gray-200);
  }
  .snippet-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-600);
  }
  .snippet-copy {
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--navy);
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .snippet-copy:hover { background: var(--gold-pale); border-color: var(--gold); }
  .snippet-copy.is-copied { background: var(--navy); border-color: var(--navy); color: #fff; }
  .snippet-text {
    margin: 0;
    padding: 14px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.65;
    color: var(--gray-800);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 320px;
    overflow-y: auto;
  }
  .step-pending-note {
    font-size: 12px;
    color: var(--amber);
    background: var(--amber-pale);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    line-height: 1.5;
  }

  .mark-btn {
    align-self: flex-start;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--gray-200);
    background: transparent;
    color: var(--gray-600);
    cursor: pointer;
    transition: all 0.18s;
  }
  .mark-btn:hover {
    border-color: var(--navy-light);
    color: var(--navy);
    background: var(--navy-pale);
  }
  .mark-btn.is-done-btn {
    border-color: var(--navy-light);
    color: var(--navy);
    background: var(--navy-pale);
  }

  /* DIVIDER */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0 2px;
  }
  .section-divider-line {
    flex: 1;
    height: 1px;
    background: var(--gray-200);
  }
  .section-intro {
    font-size: 13px;
    line-height: 1.65;
    color: var(--gray-600);
    max-width: 78ch;
    margin: 2px auto 6px;
    text-align: center;
  }
  .section-divider-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-400);
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem;
    font-size: 12px;
    color: var(--gray-400);
  }

  @media (max-width: 480px) {
    .hero { padding: 2rem 1.25rem 3.5rem; }
    .progress-section, .steps-section { padding: 0 1rem; }
    .step-body-inner { padding-left: 16px; }
    .progress-card { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
  }
.faixa-gestao {
  background: var(--night);
  color: #E8EDF4;
  font-size: 0.86rem;
  line-height: 1.5;
  padding: 0.75rem 1.5rem;
  text-align: center;
  border-bottom: 3px solid var(--gold);
}
.faixa-gestao strong { color: var(--gold); font-weight: 600; }
.faixa-gestao code {
  background: rgba(255,255,255,0.12);
  padding: 0.05rem 0.3rem;
  border-radius: 3px;
  font-size: 0.95em;
}

  /* ======= CURSO: retomada, modulos, aulas, video ======= */


  /* Cartao de retomada — onde a pessoa parou */
  .retomada {
    background: var(--night);
    border-radius: var(--radius);
    padding: 1.5rem 1.75rem;
    color: #E8EDF4;
    position: relative;
    overflow: hidden;
  }
  .retomada::after {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: var(--gold);
  }
  .retomada-topo {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 0.9rem;
  }
  .retomada-eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }
  .retomada-prog { font-size: 12px; color: #9FB0C4; white-space: nowrap; }
  .retomada-modulo {
    font-size: 12px;
    color: #9FB0C4;
    margin-bottom: 0.3rem;
  }
  .retomada-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 500;
    line-height: 1.25;
    color: #fff;
    margin-bottom: 0.65rem;
  }
  .retomada-meta {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    font-size: 12px;
    color: #9FB0C4;
    margin-bottom: 1.1rem;
  }
  .retomada-track {
    height: 5px;
    background: rgba(255,255,255,0.14);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 1.1rem;
  }
  .retomada-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .retomada-btn {
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: var(--radius-sm);
    padding: 0.65rem 1.25rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .retomada-btn:hover { filter: brightness(1.08); }
  .retomada.is-completa::after { background: var(--cream); }
  .retomada.is-completa .retomada-eyebrow { color: var(--cream); }

  /* Modulos */
  .modulo { margin-top: 2.25rem; }
  .modulo:first-child { margin-top: 0.5rem; }
  .modulo-hdr {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--gray-200);
    margin-bottom: 1rem;
  }
  .modulo-id {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--gold-deep);
    background: var(--gold-pale);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .modulo-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--navy);
    flex: 1;
    min-width: 0;
  }
  .modulo-meta {
    font-size: 12px;
    color: var(--gray-600);
    white-space: nowrap;
  }
  .modulo-track {
    flex-basis: 100%;
    height: 3px;
    background: var(--gray-100);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 0.5rem;
  }
  .modulo-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .modulo-intro {
    font-size: 13px;
    line-height: 1.6;
    color: var(--gray-600);
    margin-bottom: 1rem;
    padding-left: 0.85rem;
    border-left: 2px solid var(--gold-pale);
  }
  .modulo-aulas { display: flex; flex-direction: column; gap: 10px; }

  /* Aula — linha de meta com tipo e duracao */
  .aula-meta {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    margin-top: 5px;
    font-size: 11.5px;
    color: var(--gray-600);
  }
  .aula-tipo {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
  }
  .aula-tipo svg { flex-shrink: 0; opacity: 0.75; }
  .aula-sep { color: var(--gray-200); }
  .step.is-done .aula-meta { opacity: 0.6; }

  /* Validacao fecha a trilha */
  .step.is-validacao { border-color: var(--gold); }
  .step.is-validacao .step-num {
    background: var(--gold-pale);
    color: var(--gold-deep);
  }
  .step.is-validacao.is-done .step-num { background: var(--navy-light); color: #fff; }

  /* Capa e player de video */
  .video-capa {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--night);
    cursor: pointer;
    border: none;
    padding: 0;
    display: block;
    margin: 0 0 1rem;
  }
  .video-capa img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease, filter 0.25s;
  }
  .video-capa:hover img { transform: scale(1.03); filter: brightness(0.85); }
  .video-capa-vazia {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--night), var(--ink));
  }
  .video-play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 58px; height: 58px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(10,20,34,0.45);
    transition: transform 0.2s;
    pointer-events: none;
  }
  .video-capa:hover .video-play { transform: translate(-50%, -50%) scale(1.08); }
  .video-rotulo {
    position: absolute;
    left: 10px; bottom: 10px;
    background: rgba(10,20,34,0.82);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
    pointer-events: none;
  }
  .video-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: var(--radius-sm);
    display: block;
    margin: 0 0 1rem;
    background: var(--ink);
  }

  @media (max-width: 640px) {
    .retomada { padding: 1.25rem 1.1rem; }
    .retomada-titulo { font-size: 20px; }
    .modulo-titulo { font-size: 18px; }
    .modulo-hdr { gap: 0.5rem; }
  }

  /* Aula em partes: um palco e a lista de partes embaixo */
  .partes { margin: 0 0 1.25rem; }
  .partes-palco > .video-capa,
  .partes-palco > .video-frame { margin-bottom: 0.75rem; }
  .partes-nota {
    margin: 0 0 0.85rem;
    font-size: 14px;
    line-height: 1.55;
    color: var(--gray-600);

    padding-left: 0.8rem;
  }
  .partes-lista {
    display: grid;
    /* auto-fit para que tres partes preencham a linha como quatro preenchem */
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

  }
  .parte-btn {
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-align: left;
    padding: 10px 12px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    background: white;
    cursor: pointer;
    font: inherit;
    color: inherit;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .parte-btn:hover { border-color: var(--gold); }
  .parte-btn.is-ativa {
    background: var(--night);
    border-color: var(--night);
    color: white;
    box-shadow: 0 3px 14px rgba(10,20,34,0.14);
  }
  .parte-n {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold-deep);
  }
  .parte-btn.is-ativa .parte-n { color: var(--gold); }
  .parte-titulo { font-size: 13px; line-height: 1.35; font-weight: 500; }
  .parte-dur { font-size: 11px; color: var(--gray-600); }
  .parte-btn.is-ativa .parte-dur { color: rgba(255,255,255,0.65); }
  @media (max-width: 480px) {
    .partes-lista { grid-template-columns: 1fr; }
  }

  /* Galeria: links de video viram capa clicavel */
  .video-galeria {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 1rem;
  }
  .video-item {
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: white;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .video-item:hover {
    border-color: var(--gold);
    box-shadow: 0 3px 14px rgba(10,20,34,0.10);
  }
  .video-item-capa {
    position: relative;
    aspect-ratio: 16 / 9;
    background: var(--night);
    overflow: hidden;
  }
  .video-item-capa img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.35s ease;
  }
  .video-item:hover .video-item-capa img { transform: scale(1.05); }
  .video-item-play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(215,171,92,0.95);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .video-item-txt {
    padding: 8px 10px 10px;
    font-size: 12px;
    line-height: 1.35;
    font-weight: 500;
  }
  @media (max-width: 560px) {
    .video-galeria { grid-template-columns: 1fr; }
  }

  /* A caixa cresce ate a lateral, mas a linha de texto para antes:
     linha longa demais cansa e faz perder a proxima. */
  .step-desc, .sub-step-why, .sub-step-result, .modulo-intro,
  .etapa-recall p, .snippet-text { max-width: 86ch; }
  .retomada-titulo { max-width: 24ch; }

  /* Com a pagina larga cabe uma terceira capa por linha */
  @media (min-width: 900px) {
    .video-galeria { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 1300px) {
    .video-galeria { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 760px) {
    .progress-section, .steps-section, .trilha-tabs { padding: 0 1.25rem; }
  }

  /* ============ LAYOUT DE CURSO: cabeca, modulos, lado, painel ============ */

  .cabeca { background: var(--night); border-bottom: 1px solid rgba(255,255,255,0.08); }
  .cabeca-inner {
    max-width: var(--largura);
    margin: 0 auto;
    padding: 1.1rem 2.5rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  .cabeca-txt { flex: 1; min-width: 200px; }
  .cabeca-eyebrow {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .cabeca-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 500;
    color: #fff;
    line-height: 1.1;
  }
  .cabeca-prog { display: flex; align-items: center; gap: 10px; min-width: 150px; }
  .cabeca-prog-track {
    width: 110px; height: 5px;
    background: rgba(255,255,255,0.16);
    border-radius: 99px; overflow: hidden;
  }
  .cabeca-prog-fill { height: 100%; width: 0; background: var(--gold); border-radius: 99px; transition: width 0.4s ease; }
  .cabeca-prog-num { font-size: 12px; color: var(--gold); font-weight: 600; }

  /* abas de trilha dentro da cabeca escura */
  .cabeca .trilha-tabs { margin: 0; padding: 0; max-width: none; width: auto; gap: 6px; }
  .cabeca .trilha-tab {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: #C9D4E2;
    padding: 7px 14px;
    font-size: 12.5px;
  }
  .cabeca .trilha-tab.is-active { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .cabeca .trilha-tab.is-active .trilha-tab-count { background: rgba(10,20,34,0.22); color: var(--ink); }
  .cabeca .trilha-tab-count { background: rgba(255,255,255,0.14); color: #C9D4E2; }

  /* Navegacao de modulos — as "ondas" no topo */
  .mod-nav {
    background: var(--ink);
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0.85rem 2.5rem;
    max-width: var(--largura);
    margin: 0 auto;
    scrollbar-width: thin;
  }
  .mod-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 99px;
    padding: 7px 15px 7px 7px;
    color: #C9D4E2;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
  }
  .mod-btn:hover { background: rgba(255,255,255,0.12); }
  .mod-btn.is-ativo { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .mod-btn-n {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    flex-shrink: 0;
  }
  .mod-btn.is-ativo .mod-btn-n { background: rgba(10,20,34,0.2); }
  .mod-btn.is-completo .mod-btn-n { background: var(--gold); color: var(--ink); }
  .mod-btn.is-ativo.is-completo .mod-btn-n { background: rgba(10,20,34,0.2); color: var(--ink); }
  .mod-btn-cont { font-size: 11px; opacity: 0.72; }

  /* Duas colunas: lista de aulas e painel */
  .curso {
    max-width: var(--largura);
    margin: 1.5rem auto 4rem;
    padding: 0 2.5rem;
    display: grid;
    grid-template-columns: 290px 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  .curso-lado {
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 10px;
    position: sticky;
    top: 1rem;
    max-height: calc(100vh - 2rem);
    overflow-y: auto;
  }
  .lado-topo {
    padding: 8px 8px 12px;
    border-bottom: 1px solid var(--gray-100);
    margin-bottom: 8px;
  }
  .lado-modulo {
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--gold-deep);
    font-weight: 700;
  }
  .lado-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: var(--navy);
    margin-top: 2px;
    line-height: 1.2;
  }
  .lado-meta { font-size: 11.5px; color: var(--gray-600); margin-top: 4px; }

  .aula-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: 0;
    border-radius: var(--radius-sm);
    padding: 7px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: background 0.15s;
  }
  .aula-item:hover { background: var(--gray-50); }
  .aula-item.is-atual { background: var(--gold-pale); }
  .aula-item.is-travada { cursor: not-allowed; opacity: 0.5; }
  .aula-item.is-travada:hover { background: none; }

  .aula-mini {
    width: 62px; height: 40px;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--night);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold);
    position: relative;
  }
  .aula-mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .aula-mini-n {
    position: absolute;
    left: 3px; bottom: 3px;
    background: rgba(10,20,34,0.82);
    color: #fff;
    font-size: 9.5px;
    font-weight: 600;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
  }
  .aula-item-txt { flex: 1; min-width: 0; }
  .aula-item-nome {
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--text);
  }
  .aula-item.is-atual .aula-item-nome { color: var(--gold-deep); font-weight: 600; }
  .aula-item-sub {
    font-size: 10.5px;
    color: var(--gray-600);
    margin-top: 2px;
    display: flex; align-items: center; gap: 4px;
  }
  .aula-item-check { color: var(--navy-light); font-size: 13px; flex-shrink: 0; }

  /* Painel da aula */
  .curso-painel {
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 1.75rem 2rem 2rem;
    min-width: 0;
  }
  .painel-eyebrow {
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--gold-deep);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .painel-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 27px;
    font-weight: 500;
    color: var(--navy);
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .painel-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--gray-600);
    margin-bottom: 1.25rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px solid var(--gray-100);
  }

  /* "Passo 1: ..." dentro da aula */
  .passo-hdr {
    background: var(--night);
    color: #fff;
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 600;
    margin: 1.5rem 0 1rem;
    display: flex; align-items: baseline; gap: 8px;
  }
  .passo-hdr:first-of-type { margin-top: 0; }
  .passo-hdr-n { color: var(--gold); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }

  .painel-rodape {
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--gray-100);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .painel-prox {
    font-size: 12px;
    color: var(--gray-600);
  }
  .painel-prox strong { color: var(--navy); font-weight: 600; }

  .painel-travado {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--gray-600);
  }
  .painel-travado-ico { font-size: 28px; display: block; margin-bottom: 10px; }

  .painel-fim {
    background: var(--night);
    color: #E8EDF4;
    border-radius: var(--radius);
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.5rem;
    border-top: 3px solid var(--cream);
  }
  .painel-fim h3 {
    font-family: 'Playfair Display', serif;
    font-size: 21px; font-weight: 500; color: #fff; margin-bottom: 6px;
  }
  .painel-fim p { font-size: 13.5px; line-height: 1.6; color: #9FB0C4; }

  @media (max-width: 980px) {
    .curso { grid-template-columns: 1fr; }
    .curso-lado { position: static; max-height: none; }
    .aula-item { padding: 8px; }
  }
  @media (max-width: 760px) {
    .cabeca-inner, .mod-nav, .curso { padding-left: 1.25rem; padding-right: 1.25rem; }
    .cabeca-inner { gap: 0.9rem; }
    .cabeca-titulo { font-size: 20px; }
    .curso-painel { padding: 1.25rem 1.1rem 1.5rem; }
    .painel-titulo { font-size: 22px; }
    .passo-hdr { font-size: 14px; padding: 9px 13px; }
  }
</style>

<div class="topbar">
  <div class="topbar-logo">Podium <span>Educação</span></div>
</div>

<div class="faixa-gestao" id="faixa-gestao" hidden>
  <strong>Modo de revisão</strong> — todos os passos estão abertos para você conferir o conteúdo. Nada que você marcar aqui é gravado. Quem abre o link sem <code>?gestao</code> continua destravando um passo por vez.

<header class="cabeca">
  <div class="cabeca-inner">

<footer>Podium Educação · Uso interno</footer>

<script>
const STEPS_COMERCIAL = [
  {
    name: "Entender o papel do Executivo de Vendas",
    tipo: "Fundamento",
    tag: "must", tagTxt: "obrigatório",
    desc: "O Executivo atende o lead do início ao fim: recebe, qualifica, conduz a consultoria e fecha. Turno único, dono único — não existe passagem de bastão, e todas as faixas de faturamento são suas. Antes das metas, a régua: todo lead percorre Lead → SAL → SQL → Ganho, e é esse o vocabulário que a gestão usa.",
    links: [],
    subSteps: [
      { order: "Papel", title: "Atender o lead do início ao fim", why: "O mesmo Executivo que recebe o lead é quem qualifica, conduz a consultoria e fecha. Não existe repasse — o contexto inteiro fica com você, da primeira ligação ao pagamento. O randomizador distribui conforme o seu nível e a faixa de faturamento, e o lead que caiu com você é seu até fechar ou perder.", result: "Um dono por lead, do primeiro contato à venda." },
      { order: "Régua", title: "Lead → SAL → SQL → Ganho", why: "Lead é quem entrou e ainda não sabemos se tem perfil. SAL é o lead qualificado, que bateu os quatro critérios de ICP e foi para 3 - Qualificado/Reunião Agendada. SQL é quem já recebeu o pitch: teve a call e ouviu o valor. Ganho é quem pagou. Todo SQL já foi SAL — agendar reunião não faz do lead um SQL, quem faz é a reunião acontecer com valor apresentado.", result: "O campo [COM] QUALIFICAÇÃO no card mostra em que ponto o lead está: LEAD, SAL ou SQL." },
      { order: "Disciplina", title: "100% das atividades do dia", why: "Trabalhar todas as atividades do dia, na ordem de vencimento do filtro CADÊNCIA DIÁRIA — sem escolher lead e sem pular fila. Cada atividade de contato tem uma regra de toque: pelo menos 2 ligações pela API4COM, depois ligação no WhatsApp, depois mensagem no WhatsApp. E o CRM fica sempre atualizado e limpo: atividade não finalizada ou etapa errada quebra o funil e distorce os números de todo mundo.", result: "Filtro zerado no fim do dia e Pipedrive como retrato real da sua carteira." },
      { order: "Disciplina", title: "Lead D0: dois contatos no mesmo dia", why: "O lead mais quente é o que caiu hoje. Todo lead que entrou no dia recebe dois contatos: o primeiro de preferência logo depois de cair, e um segundo ainda no mesmo dia. Esse é o mínimo inegociável da disciplina.", result: "Nenhum lead do dia termina o dia com menos de duas tentativas." },
      { order: "Disciplina", title: "SLA de 10 minutos — o ideal, não a régua", why: "Dez minutos é o tempo ideal entre o lead entrar e receber o primeiro contato, contado pela conclusão da atividade. É referência, não cobrança rígida: ninguém interrompe uma apresentação para responder um lead que acabou de entrar. Fora da call, o lead novo é a prioridade.", result: "Fora de call, lead novo na frente. O que não se negocia é o D0 com dois contatos." },
      { order: "Resultado", title: "6 SAL por dia", why: "Seis leads qualificados por dia, com todos os critérios do ICP batidos. É o piso do aproveitamento da base — mede quanto da sua carteira você consegue transformar em conversa de verdade.", result: "Mover o card para 3 - Qualificado/Reunião Agendada é o que registra o SAL." },

// Modo de revisao da gestao: abrir a pagina com ?gestao destrava todos os
// passos para conferir conteudo, sem gravar progresso no navegador de quem abre.
const MODO_GESTAO = /[?&]gestao(=|&|$)/.test(location.search);
if (MODO_GESTAO) {
  const faixa = document.getElementById("faixa-gestao");
  if (faixa) faixa.hidden = false;
}

// Desbloqueio progressivo: um passo so abre depois que todos os anteriores
// foram concluidos. O primeiro esta sempre liberado.
function liberado(i) {
  if (MODO_GESTAO) return true;
  for (let k = 0; k < i; k++) { if (!done[k]) return false; }
  return true;
}

function proximoLiberado() {
  for (let i = 0; i < TOTAL; i++) { if (!done[i]) return i; }
  return -1;
}

function trocarTrilha(t) {
  if (!TRILHAS[t] || t === trilhaAtual) return;
  trilhaAtual = t;
  try { localStorage.setItem("podium-onboarding-trilha", t); } catch (e) {}
  carregarProgresso();
  renderTabs();
  aplicarTextos();
  renderSteps();
}

function aplicarTextos() {
  const t = TEXTOS[trilhaAtual];
  if (!t) return;
  const eb = document.getElementById("hero-eyebrow");
  if (eb) eb.textContent = t.eyebrow;
}

function renderTabs() {
  const nav = document.getElementById("trilha-tabs");
  if (!nav) return;
  nav.innerHTML = "";
  Object.keys(TRILHAS).forEach(function(t) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "trilha-tab" + (t === trilhaAtual ? " is-active" : "");
    b.setAttribute("aria-pressed", t === trilhaAtual ? "true" : "false");
    const n = TRILHAS[t].steps.length;
    b.innerHTML = TRILHAS[t].label + ' <span class="trilha-tab-count">' + n + '</span>';
    b.addEventListener("click", function() { trocarTrilha(t); });
    nav.appendChild(b);
  });
}

function save() {
  if (MODO_GESTAO) return;
  try { localStorage.setItem(chaveProgresso(trilhaAtual), JSON.stringify(done)); } catch(e) {}
}

// Em que etapa cada passo-trilha esta. A chave carrega a trilha para que
// Comercial e Farmer nao disputem o mesmo passo.
const etapaAberta = {};
function chaveEtapa(i) { return trilhaAtual + ":" + i; }

function cartaoFala(p) {
  const li = document.createElement("li");
  const corte = p.indexOf(" :: ");
  if (corte > 0) {
    const et = document.createElement("span");
    et.className = "fala-etiqueta";
    et.textContent = p.slice(0, corte);
    li.appendChild(et);
    li.appendChild(document.createTextNode(p.slice(corte + 4)));
  } else {
    li.textContent = p;
  }
  return li;
}

function montarTrilha(inner, s, idx) {
  const etapas = s.subSteps;
  const chave = chaveEtapa(idx);
  let atual = etapaAberta[chave] || 0;
  if (atual > etapas.length - 1) atual = 0;

  const caixa = document.createElement("div");

  function desenhar() {
    caixa.innerHTML = "";

    // mapa: todas as etapas de relance, a atual em destaque
    const mapa = document.createElement("div");
    mapa.className = "mapa";
    etapas.forEach(function(e, n) {
      const no = document.createElement("button");
      no.type = "button";
      no.className = "mapa-no" + (n === atual ? " is-atual" : "") + (n < atual ? " is-feito" : "");
      no.setAttribute("aria-current", n === atual ? "step" : "false");
      const bolha = document.createElement("span");
      bolha.className = "mapa-bolha";
      bolha.textContent = n < atual ? "✓" : (n + 1);
      const rot = document.createElement("span");
      rot.className = "mapa-rotulo";
      // No mapa cabe pouco texto; "curto" existe so onde o titulo e longo demais.
      rot.textContent = e.curto || e.title;
      no.appendChild(bolha);
      no.appendChild(rot);
      no.addEventListener("click", function(ev) {
        ev.stopPropagation();
        atual = n; etapaAberta[chave] = n; desenhar(); syncOpenHeight();
      });
      mapa.appendChild(no);
    });
    caixa.appendChild(mapa);

    const e = etapas[atual];

    const topo = document.createElement("div");
    topo.className = "etapa-topo";
    const cont = document.createElement("span");
    cont.className = "etapa-contador";
    cont.textContent = "Etapa " + (atual + 1) + " de " + etapas.length;
    const nome = document.createElement("span");
    nome.className = "etapa-nome";
    nome.textContent = e.title;
    topo.appendChild(cont); topo.appendChild(nome);
    caixa.appendChild(topo);

    const why = document.createElement("p");
    why.className = "sub-step-why";
    why.textContent = e.why;
    caixa.appendChild(why);

    const res = document.createElement("p");
    res.className = "sub-step-result";
    res.textContent = e.result;
    caixa.appendChild(res);

    if (e.falas && e.falas.length) {
      const ul = document.createElement("ul");
      ul.className = "falas";
      e.falas.forEach(function(p) { ul.appendChild(cartaoFala(p)); });
      caixa.appendChild(ul);
    }

    // recuperacao ativa: a pessoa tenta repetir antes de seguir
    const rec = document.createElement("div");
    rec.className = "etapa-recall";
    const pRec = document.createElement("p");
    pRec.innerHTML = "<strong>Antes de avançar:</strong> feche os olhos e tente repetir, com as suas palavras, o que você faria nesta etapa. Se travar, leia de novo — é a tentativa de lembrar que fixa, não a releitura.";
    rec.appendChild(pRec);
    caixa.appendChild(rec);

    const nav = document.createElement("div");
    nav.className = "etapa-nav";
    const voltar = document.createElement("button");
    voltar.type = "button";
    voltar.className = "etapa-btn";
    voltar.textContent = "← Anterior";
    voltar.disabled = atual === 0;
    voltar.addEventListener("click", function(ev) {
      ev.stopPropagation();
      if (atual > 0) { atual--; etapaAberta[chave] = atual; desenhar(); syncOpenHeight(); }
    });
    nav.appendChild(voltar);

    if (atual < etapas.length - 1) {
      const avancar = document.createElement("button");
      avancar.type = "button";
      avancar.className = "etapa-btn is-principal";
      const prox = etapas[atual + 1];
      avancar.textContent = "Próxima: " + (prox.curto || prox.title) + " →";
      avancar.addEventListener("click", function(ev) {
        ev.stopPropagation();
        atual++; etapaAberta[chave] = atual; desenhar(); syncOpenHeight();
      });
      nav.appendChild(avancar);
    } else {
      const fim = document.createElement("span");
      fim.className = "etapa-contador";
      fim.textContent = "Fim das etapas";
      nav.appendChild(fim);
    }
    caixa.appendChild(nav);
  }

  desenhar();
  inner.appendChild(caixa);
}

// Capa do video no card aberto. Clicou, a capa vira o player embutido —
// Loom e Drive permitem iframe, entao a aula roda sem sair da trilha.
function urlEmbed(v) {
  if (v.kind === "loom")  return "https://www.loom.com/embed/" + v.id;
  if (v.kind === "drive") return "https://drive.google.com/file/d/" + v.id + "/preview";
  return null;
}
function urlCapa(v) {
  if (v.thumb) return v.thumb;
  if (v.kind === "drive") return "https://drive.google.com/thumbnail?id=" + v.id + "&sz=w800";
  return null;
}

// Capa clicavel de um video. Serve tanto para a aula de video unico quanto
// para cada parte de uma aula dividida.
function capaDeVideo(v, rotulo, aria) {
  const capa = document.createElement("button");
  capa.className = "video-capa";
  capa.type = "button";
  capa.setAttribute("aria-label", aria);

  const src = urlCapa(v);
  if (src) {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "";
    img.loading = "lazy";
    // Capa do Loom tem hash na URL e pode expirar; sem ela fica o fundo escuro.
    img.addEventListener("error", function() {
      const vazio = document.createElement("div");
      vazio.className = "video-capa-vazia";
      img.replaceWith(vazio);
    });
    capa.appendChild(img);
  } else {
    const vazio = document.createElement("div");
    vazio.className = "video-capa-vazia";
    capa.appendChild(vazio);
  }

  const play = document.createElement("span");
  play.className = "video-play";
  play.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M7 4.5v11l9-5.5z"/></svg>';
  capa.appendChild(play);

  const rot = document.createElement("span");
  rot.className = "video-rotulo";
  rot.textContent = rotulo;
  capa.appendChild(rot);

  return capa;
}

function quadroDeVideo(embed) {
  const frame = document.createElement("iframe");
  frame.className = "video-frame";
  frame.src = embed;
  frame.allow = "fullscreen";
  frame.allowFullscreen = true;
  return frame;
}

function montarVideo(inner, s) {
  const v = s.video;
  const embed = urlEmbed(v);
  if (!embed) return;

  const capa = capaDeVideo(v, s.dur ? ("Assistir · " + s.dur) : "Assistir aqui", "Assistir: " + s.name);
  capa.addEventListener("click", function(ev) {
    ev.stopPropagation();
    capa.replaceWith(quadroDeVideo(embed));
    syncOpenHeight();
  });

  inner.appendChild(capa);
}

// Aula dividida em partes: um palco so, e a lista embaixo troca qual parte
// esta no palco. Evita varios players empilhados e deixa clara a ordem.
function montarPartes(inner, s) {
  const rotulo = s.rotuloParte || "Parte";
  const wrap = document.createElement("div");
  wrap.className = "partes";

  const palco = document.createElement("div");
  palco.className = "partes-palco";
  wrap.appendChild(palco);

  const nota = document.createElement("p");
  nota.className = "partes-nota";
  wrap.appendChild(nota);

  const lista = document.createElement("div");
  lista.className = "partes-lista";
  const botoes = [];

  function abrir(n, tocar) {
    const v = s.videos[n];
    botoes.forEach(function(b, k) { b.classList.toggle("is-ativa", k === n); });

    nota.textContent = v.nota || "";
    nota.hidden = !v.nota;

    palco.innerHTML = "";
    if (tocar) {
      palco.appendChild(quadroDeVideo(urlEmbed(v)));
    } else {
      const r = rotulo + " " + (n + 1);
      const capa = capaDeVideo(v, v.dur ? (r + " · " + v.dur) : r, "Assistir " + r + ": " + (v.titulo || s.name));
      capa.addEventListener("click", function(ev) { ev.stopPropagation(); abrir(n, true); });
      palco.appendChild(capa);
    }
    syncOpenHeight();
  }

  s.videos.forEach(function(v, n) {
    const b = document.createElement("button");
    b.className = "parte-btn";
    b.type = "button";
    const et = document.createElement("span");
    et.className = "parte-n";
    et.textContent = rotulo + " " + (n + 1);
    b.appendChild(et);
    if (v.titulo) {
      const t = document.createElement("span");
      t.className = "parte-titulo";
      t.textContent = v.titulo;
      b.appendChild(t);
    }
    if (v.dur) {
      const d = document.createElement("span");
      d.className = "parte-dur";
      d.textContent = v.dur;
      b.appendChild(d);
    }
    b.addEventListener("click", function(ev) { ev.stopPropagation(); abrir(n, false); });
    botoes.push(b);
    lista.appendChild(b);
  });

  wrap.appendChild(lista);
  inner.appendChild(wrap);
  abrir(0, false);
}

// Link de video do YouTube vira capa. O id sai do v= da URL; playlist e canal
// nao tem capa previsivel e seguem como link de texto.
function idYoutube(url) {
  const m = url.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

function montarGaleria(inner, links) {
  const g = document.createElement("div");
  g.className = "video-galeria";
  links.forEach(function(l) {
    const a = document.createElement("a");
    a.className = "video-item";
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.addEventListener("click", function(ev) { ev.stopPropagation(); });

    const capa = document.createElement("div");
    capa.className = "video-item-capa";
    const img = document.createElement("img");
    img.src = "https://img.youtube.com/vi/" + l.ytId + "/hqdefault.jpg";
    img.alt = "";
    img.loading = "lazy";

    play.className = "video-item-play";
    play.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M7 4.5v11l9-5.5z"/></svg>';
    capa.appendChild(play);

// ======= LAYOUT DE CURSO =======
// A pagina deixou de ser uma sanfona: os modulos ficam no topo, as aulas do
// modulo na lateral e a aula escolhida ocupa o painel.

// Sem sanfona nao ha altura para animar; montarTrilha ainda chama isso.
function syncOpenHeight() {}

function grupos() { return TRILHAS[trilhaAtual].groups; }

function moduloDaAula(i) {
  const g = grupos();
  for (let k = 0; k < g.length; k++) {
    if (g[k].indices.indexOf(i) >= 0) return k;
  }
  return 0;
}

// Miniatura da aula: a capa do proprio video, a do primeiro video da galeria,
// ou nada — nesse caso entra o icone do tipo sobre o azul-noite.
function idsDeVideo(s) {
  const ids = [];
  if (s.video) ids.push(s.video.id);
  if (s.videos) s.videos.forEach(function(v) { ids.push(v.id); });
  return ids;
}

function miniatura(s) {
  if (s.video) return urlCapa(s.video);
  if (s.videos && s.videos.length > 0) return urlCapa(s.videos[0]);
  if (s.links) {
    for (const l of s.links) {
      const yt = idYoutube(l.url);
      if (yt) return "https://img.youtube.com/vi/" + yt + "/mqdefault.jpg";
    }
  }
  return null;
}

function irParaAula(i) {
  if (!liberado(i)) return;
  aulaAtual = i;
  moduloAtual = moduloDaAula(i);
  renderCurso();
  if (window.innerWidth <= 980) {
    const p = document.getElementById("curso-painel");
    if (p) p.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

// ---------- navegacao de modulos ----------
function renderModNav() {
  const nav = document.getElementById("mod-nav");
  nav.innerHTML = "";
  grupos().forEach(function(g, gi) {
    const feitas = g.indices.filter(k => done[k]).length;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mod-btn" + (gi === moduloAtual ? " is-ativo" : "") + (feitas === g.indices.length ? " is-completo" : "");
    const n = document.createElement("span");
    n.className = "mod-btn-n";
    n.textContent = feitas === g.indices.length ? "✓" : (gi + 1);
    const t = document.createElement("span");
    t.textContent = g.label;
    const c = document.createElement("span");
    c.className = "mod-btn-cont";
    c.textContent = feitas + "/" + g.indices.length;
    b.appendChild(n); b.appendChild(t); b.appendChild(c);
    b.addEventListener("click", function() {
      moduloAtual = gi;
      // ao trocar de modulo, cai na primeira aula dele que estiver liberada
      const livre = g.indices.find(k => liberado(k));
      aulaAtual = livre !== undefined ? livre : g.indices[0];
      renderCurso();
    });
    nav.appendChild(b);
  });
}

// ---------- lista lateral de aulas ----------
function renderLado() {
  const lado = document.getElementById("curso-lado");
  lado.innerHTML = "";
  const g = grupos()[moduloAtual];
  const feitas = g.indices.filter(k => done[k]).length;

  const topo = document.createElement("div");
  topo.className = "lado-topo";
  const mid = document.createElement("p");
  mid.className = "lado-modulo";
  mid.textContent = "Módulo " + (moduloAtual + 1);
  const mt = document.createElement("p");
  mt.className = "lado-titulo";
  mt.textContent = g.label;
  const mm = document.createElement("p");
  mm.className = "lado-meta";
  mm.textContent = g.indices.length + (g.indices.length === 1 ? " aula" : " aulas") + " · " + feitas + " concluída" + (feitas === 1 ? "" : "s");
  topo.appendChild(mid); topo.appendChild(mt); topo.appendChild(mm);
  lado.appendChild(topo);

  g.indices.forEach(function(i) {
    const s = STEPS[i];
    const aberto = liberado(i);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "aula-item" + (i === aulaAtual ? " is-atual" : "") + (aberto ? "" : " is-travada");
    b.disabled = !aberto;

    const mini = document.createElement("div");
    mini.className = "aula-mini";
    const src = aberto ? miniatura(s) : null;
    if (src) {
      const img = document.createElement("img");
      img.src = src; img.alt = ""; img.loading = "lazy";
      img.addEventListener("error", function() {
        img.remove();
        mini.insertAdjacentHTML("afterbegin", ICONE_TIPO[s.tipo] || "");
      });
      mini.appendChild(img);
    } else {
      mini.innerHTML = aberto ? (ICONE_TIPO[s.tipo] || "") : '<span style="font-size:13px">🔒</span>';
    }
    const num = document.createElement("span");
    num.className = "aula-mini-n";
    num.textContent = i + 1;
    mini.appendChild(num);
    b.appendChild(mini);

    const txt = document.createElement("div");
    txt.className = "aula-item-txt";
    const nome = document.createElement("div");
    nome.className = "aula-item-nome";
    nome.textContent = s.name;
    const sub = document.createElement("div");
    sub.className = "aula-item-sub";
    sub.textContent = (s.tipo || "Aula") + (s.dur ? " · " + s.dur : "");
    txt.appendChild(nome); txt.appendChild(sub);
    b.appendChild(txt);

    if (done[i]) {
      const ck = document.createElement("span");
      ck.className = "aula-item-check";
      ck.textContent = "✓";
      b.appendChild(ck);
    }

    b.addEventListener("click", function() { irParaAula(i); });
    lado.appendChild(b);
  });
}

// ---------- painel da aula ----------
function cabecaDePasso(painel, n, texto) {
  const h = document.createElement("div");
  h.className = "passo-hdr";
  const et = document.createElement("span");
  et.className = "passo-hdr-n";
  et.textContent = "Passo " + n;
  const t = document.createElement("span");
  t.textContent = texto;
  h.appendChild(et); h.appendChild(t);
  painel.appendChild(h);
  return n + 1;
}

function renderPainel() {
  const painel = document.getElementById("curso-painel");
  painel.innerHTML = "";

  if (aulaAtual < 0 || !STEPS[aulaAtual]) {
    const vazio = document.createElement("div");
    vazio.className = "painel-travado";
    vazio.innerHTML = '<span class="painel-travado-ico">📘</span>Escolha uma aula na lista ao lado.';
    painel.appendChild(vazio);
    return;
  }

  const i = aulaAtual;
  const s = STEPS[i];

  if (!liberado(i)) {
    const t = document.createElement("div");
    t.className = "painel-travado";
    t.innerHTML = '<span class="painel-travado-ico">🔒</span>Conclua a aula ' + i + ' para liberar esta.';
    painel.appendChild(t);
    return;
  }

  const eb = document.createElement("p");
  eb.className = "painel-eyebrow";
  eb.textContent = "Módulo " + (moduloAtual + 1) + " · Aula " + (i + 1) + " de " + TOTAL;
  painel.appendChild(eb);

  const tit = document.createElement("h2");
  tit.className = "painel-titulo";
  tit.textContent = s.name;
  painel.appendChild(tit);

  const meta = document.createElement("div");
  meta.className = "painel-meta";
  meta.appendChild(linhaMeta(s));
  painel.appendChild(meta);

  const desc = document.createElement("p");
  desc.className = "step-desc";
  desc.textContent = s.desc;
  painel.appendChild(desc);

  let passo = 1;

  if (s.video) {
    passo = cabecaDePasso(painel, passo, "Assista à aula abaixo");
    montarVideo(painel, s);
  }

  if (s.videos && s.videos.length > 0) {
    passo = cabecaDePasso(painel, passo, s.passoPartes || ("Assista à explicação, nas " + s.videos.length + " partes"));
    montarPartes(painel, s);
  }

  if (s.subSteps && s.trilha) {
    passo = cabecaDePasso(painel, passo, "Percorra as etapas, uma de cada vez");
    montarTrilha(painel, s, i);
  } else if (s.subSteps) {
    passo = cabecaDePasso(painel, passo, "Estude os blocos abaixo");
    const subDiv = document.createElement("div");
    subDiv.className = "sub-steps";
    s.subSteps.forEach(function(sub) {
      const subCard = document.createElement("div");
      subCard.className = "sub-step";
      subCard.innerHTML = '<div class="sub-step-hdr"><span class="sub-step-order">' + sub.order + '</span><span class="sub-step-title">' + sub.title + '</span></div><p class="sub-step-why">' + sub.why + '</p><p class="sub-step-result">' + sub.result + '</p>';
      if (sub.falas && sub.falas.length > 0) {
        const ul = document.createElement("ul");
        ul.className = "falas";
        sub.falas.forEach(function(f) { ul.appendChild(cartaoFala(f)); });
        subCard.appendChild(ul);
      }
      subDiv.appendChild(subCard);
    });
    painel.appendChild(subDiv);
  }

  if (s.links && s.links.length > 0) {
    const comCapa = [];
    const semCapa = [];
    const jaEmbutidos = idsDeVideo(s);
    s.links.forEach(function(l) {
      // O video ja toca embutido acima; repetir o mesmo link como "material"
      // so faz a aula parecer ter dois passos onde ha um.
      if (jaEmbutidos.some(function(id) { return l.url.indexOf(id) >= 0; })) return;
      const yt = idYoutube(l.url);
      if (yt) comCapa.push({ url: l.url, txt: l.txt, ytId: yt });
      else semCapa.push(l);
    });
    if (comCapa.length > 0) {
      passo = cabecaDePasso(painel, passo, comCapa.length === 1 ? "Assista ao vídeo" : "Assista aos vídeos, na ordem");
      montarGaleria(painel, comCapa);
    }
    if (semCapa.length > 0) {
      passo = cabecaDePasso(painel, passo, semCapa.length === 1 ? "Abra o material" : "Abra os materiais");
      const linksDiv = document.createElement("div");
      linksDiv.className = "step-links";
      semCapa.forEach(function(l) {
        const a = document.createElement("a");
        a.className = "step-link";
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.innerHTML = '<span class="step-link-icon">' + LINK_ICON + '</span>' + l.txt;
        linksDiv.appendChild(a);
      });
      painel.appendChild(linksDiv);
    }
  }

  if (s.snippet) {
    passo = cabecaDePasso(painel, passo, "Use a mensagem pronta");
    const box = document.createElement("div");
    box.className = "snippet";
    const shdr = document.createElement("div");
    shdr.className = "snippet-hdr";
    const slab = document.createElement("span");
    slab.className = "snippet-label";
    slab.textContent = "Mensagem pronta";
    const scopy = document.createElement("button");
    scopy.className = "snippet-copy";
    scopy.type = "button";
    scopy.textContent = "Copiar";
    scopy.addEventListener("click", function() {
      navigator.clipboard.writeText(s.snippet).then(function() {
        scopy.textContent = "Copiado ✓";
        scopy.classList.add("is-copied");
        setTimeout(function() { scopy.textContent = "Copiar"; scopy.classList.remove("is-copied"); }, 2000);
      });
    });
    shdr.appendChild(slab); shdr.appendChild(scopy);
    const stxt = document.createElement("pre");
    stxt.className = "snippet-text";
    stxt.textContent = s.snippet;
    box.appendChild(shdr); box.appendChild(stxt);
    painel.appendChild(box);
  }

  if (s.missing && s.missing.length > 0) {
    const mnote = document.createElement("div");
    mnote.className = "step-pending-note";
    mnote.textContent = "Material ainda sem link: " + s.missing.join(" · ") + ". Solicite à liderança.";
    painel.appendChild(mnote);
  }

  // rodape: concluir e o que vem depois
  const rod = document.createElement("div");
  rod.className = "painel-rodape";

  if (s.pending) {
    const note = document.createElement("div");
    note.className = "step-pending-note";
    note.textContent = "Os vídeos serão adicionados assim que gravados. Aguarde a notificação da liderança.";
    rod.appendChild(note);
  } else {
    cabecaDePasso(painel, passo, done[i] ? "Aula concluída" : "Marque como concluída para liberar a próxima");
    const btn = document.createElement("button");
    btn.className = "mark-btn" + (done[i] ? " is-done-btn" : "");
    btn.textContent = done[i] ? "✓ Concluída — desfazer" : "Marcar como concluída";
    btn.addEventListener("click", function() {
      const marcando = !done[i];
      if (!marcando) {
        // Desmarcar tranca as seguintes: senao a aula fica concluida e travada
        // ao mesmo tempo, e o contador mente.
        const posteriores = done.slice(i + 1).filter(Boolean).length;
        if (posteriores > 0) {
          const msg = posteriores === 1
            ? "Desmarcar esta aula também desmarca a aula seguinte, que já estava concluída. Continuar?"
            : "Desmarcar esta aula também desmarca as " + posteriores + " aulas seguintes, que já estavam concluídas. Continuar?";
          if (!window.confirm(msg)) return;
          for (let k = i + 1; k < TOTAL; k++) done[k] = false;
        }
      }
      done[i] = marcando;
      save();
      if (marcando) {
        const prox = proximoLiberado();
        if (prox >= 0) { aulaAtual = prox; moduloAtual = moduloDaAula(prox); }
      }
      renderCurso();
      if (window.innerWidth <= 980) {
        document.getElementById("curso-painel").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
    rod.appendChild(btn);

    if (i + 1 < TOTAL) {
      const prox = document.createElement("span");
      prox.className = "painel-prox";
      prox.innerHTML = "A seguir: <strong>" + STEPS[i + 1].name + "</strong>";
      rod.appendChild(prox);
    } else if (done[i]) {
      const fim = document.createElement("span");
      fim.className = "painel-prox";
      fim.innerHTML = "<strong>Trilha concluída.</strong> A validação agora é com a liderança, na prática.";
      rod.appendChild(fim);
    }
  }

  painel.appendChild(rod);
}

function updateProgress() {
  const n = done.filter(Boolean).length;
  const pct = Math.round(n / TOTAL * 100);
  const fill = document.getElementById("prog-fill");
  const num = document.getElementById("prog-num");
  if (fill) fill.style.width = pct + "%";
  if (num) num.textContent = pct + "%";
}

function renderCurso() {
  if (aulaAtual < 0 || aulaAtual > TOTAL - 1) {
    const prox = proximoLiberado();
    aulaAtual = prox >= 0 ? prox : TOTAL - 1;
  }
  // Uma fonte so: o modulo em foco e sempre o da aula aberta. Sem isso, trocar
  // de trilha deixava a lateral num modulo e o painel numa aula de outro.
  moduloAtual = moduloDaAula(aulaAtual);
  renderModNav();
  renderLado();
  renderPainel();
  updateProgress();
}

// trocarTrilha chama renderSteps; mantido como apelido para nao duplicar logica
function renderSteps() { renderCurso(); }

renderTabs();
aplicarTextos();
renderCurso();
</script>
</body>
</html>
