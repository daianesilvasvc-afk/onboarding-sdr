<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Trilha de Onboarding — Executivo de Vendas · Podium Educação</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #123A63;
    --navy-light: #2E6FA8;
    --navy-pale: #E8F0F9;
    --navy-mid: #9CC5E8;
    --amber: #BA7517;
    --amber-pale: #FAEEDA;
    --teal: #0E6E7D;
    --teal-pale: #E2F1F4;
    --red-pale: #FCEBEB;
    --red: #791F1F;
    --gray-50: #f8f7f4;
    --gray-100: #f0ede8;
    --gray-200: #e0dcd4;
    --gray-400: #9e9a93;
    --gray-600: #5f5c56;
    --gray-800: #2c2a26;
    --text: #1a1916;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--gray-50);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    min-height: 100vh;
  }

  /* TOP BAR */
  .topbar {
    background: var(--navy);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    color: white;
    letter-spacing: 0.01em;
  }
  .topbar-logo span {
    color: var(--navy-mid);
  }

  /* HERO */
  .hero {
    background: var(--navy);
    padding: 3rem 2rem 4rem;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0; right: 0;
    height: 48px;
    background: var(--gray-50);
    border-radius: 48px 48px 0 0;
  }
  .hero-inner {
    max-width: 680px;
    margin: 0 auto;
  }
  .hero-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--navy-mid);
    margin-bottom: 12px;
  }
  .hero-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 5vw, 40px);
    color: white;
    line-height: 1.15;
    margin-bottom: 14px;
  }
  .hero-sub {
    font-size: 15px;
    color: rgba(255,255,255,0.65);
    line-height: 1.6;
    max-width: 480px;
  }

  /* PROGRESS */
  .progress-section {
    max-width: 680px;
    margin: 2rem auto 0;
    padding: 0 2rem;
  }
  .progress-card {
    background: white;
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    border: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  .progress-text { flex: 1; }
  .progress-label {
    font-size: 13px;
    color: var(--gray-600);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 6px;
    background: var(--gray-100);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--navy-light);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-count {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    color: var(--navy);
    white-space: nowrap;
    line-height: 1;
  }
  .progress-count span {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--gray-400);
    font-weight: 400;
  }

  /* STEPS */
  .steps-section {
    max-width: 680px;
    margin: 1.5rem auto 4rem;
    padding: 0 2rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .step {
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .step.is-done {
    border-color: var(--navy-light);
  }
  .step.is-open {
    box-shadow: 0 4px 20px rgba(18, 58, 99, 0.10);
  }

  .step-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .step-header:hover { background: var(--gray-50); }

  .step-num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    flex-shrink: 0;
    background: var(--gray-100);
    color: var(--gray-600);
    transition: all 0.25s;
  }
  .step.is-done .step-num {
    background: var(--navy-light);
    color: white;
  }

  .step-info { flex: 1; min-width: 0; }
  .step-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    transition: color 0.2s;
    line-height: 1.4;
  }
  .step.is-done .step-name {
    color: var(--gray-400);
    text-decoration: line-through;
  }
  .step-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-top: 4px;
  }
  .tag-must { background: var(--red-pale); color: var(--red); }
  .tag-watch { background: var(--teal-pale); color: var(--teal); }
  .tag-do { background: var(--navy-pale); color: var(--navy); }
  .tag-soon { background: var(--amber-pale); color: var(--amber); }

  .step-chevron {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gray-400);
    transition: transform 0.25s;
  }
  .step.is-open .step-chevron { transform: rotate(180deg); }

  .step-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .step-body-inner {
    padding: 0 16px 16px 62px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .step-desc {
    font-size: 13px;
    color: var(--gray-600);
    line-height: 1.7;
  }

  .step-links {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .step-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--navy);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.15s;
  }
  .step-link:hover { color: var(--navy-light); }
  .step-link-icon {
    width: 16px;
    height: 16px;
    background: var(--navy-pale);
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    flex-shrink: 0;
  }

  .sub-steps { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  .sub-step { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius-sm); padding: 10px 12px; }
  .sub-step-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .sub-step-order { font-size: 10px; font-weight: 500; background: var(--navy-pale); color: var(--navy); border-radius: 20px; padding: 2px 8px; }
  .sub-step-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .sub-step-why { font-size: 12px; color: var(--gray-600); line-height: 1.6; margin-bottom: 4px; }
  .sub-step-result { font-size: 12px; color: var(--navy); font-weight: 500; }
  .sub-step-result::before { content: "→ "; }

  .snippet {
    margin-top: 14px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    background: #fff;
    overflow: hidden;
  }
  .snippet-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    background: var(--gray-100);
    border-bottom: 1px solid var(--gray-200);
  }
  .snippet-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-600);
  }
  .snippet-copy {
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--navy);
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .snippet-copy:hover { background: var(--navy-pale); border-color: var(--navy-mid); }
  .snippet-copy.is-copied { background: var(--navy); border-color: var(--navy); color: #fff; }
  .snippet-text {
    margin: 0;
    padding: 14px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.65;
    color: var(--gray-800);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 320px;
    overflow-y: auto;
  }
  .step-pending-note {
    font-size: 12px;
    color: var(--amber);
    background: var(--amber-pale);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    line-height: 1.5;
  }

  .mark-btn {
    align-self: flex-start;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--gray-200);
    background: transparent;
    color: var(--gray-600);
    cursor: pointer;
    transition: all 0.18s;
  }
  .mark-btn:hover {
    border-color: var(--navy-light);
    color: var(--navy);
    background: var(--navy-pale);
  }
  .mark-btn.is-done-btn {
    border-color: var(--navy-light);
    color: var(--navy);
    background: var(--navy-pale);
  }

  /* DIVIDER */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0 2px;
  }
  .section-divider-line {
    flex: 1;
    height: 1px;
    background: var(--gray-200);
  }
  .section-intro {
    font-size: 13px;
    line-height: 1.65;
    color: var(--gray-600);
    max-width: 62ch;
    margin: 2px auto 6px;
    text-align: center;
  }
  .section-divider-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-400);
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem;
    font-size: 12px;
    color: var(--gray-400);
  }

  @media (max-width: 480px) {
    .hero { padding: 2rem 1.25rem 3.5rem; }
    .progress-section, .steps-section { padding: 0 1rem; }
    .step-body-inner { padding-left: 16px; }
    .progress-card { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
  }
</style>
</head>

const TAG_CLS = { must: "tag-must", watch: "tag-watch", do: "tag-do", soon: "tag-soon" };
const LINK_ICON = "↗";

const TOTAL = 19;
let done = JSON.parse(localStorage.getItem("podium-onboarding-done") || "null");
if (!done || done.length !== TOTAL) { done = new Array(TOTAL).fill(false); localStorage.setItem("podium-onboarding-done", JSON.stringify(done)); }
let openIdx = -1;

function save() {
  try { localStorage.setItem("podium-onboarding-done", JSON.stringify(done)); } catch(e) {}
}

function updateProgress() {
  const n = done.filter(Boolean).length;
  const pct = Math.round(n / TOTAL * 100);
  document.getElementById("prog-label").textContent = n + " de " + TOTAL + " etapas concluídas";
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-count").innerHTML = n + ' <span>/ ' + TOTAL + '</span>';
}

let openBody = null;
let openInner = null;

// Com o card fechado o body fica em max-height:0 + overflow:hidden, e nesse
// estado o scrollHeight do conteudo vem errado (layout colapsado). Medir so
// vale com a altura liberada — por isso o none temporario.
function measureOpen() {
  const anterior = openBody.style.maxHeight;
  openBody.style.maxHeight = "none";
  const altura = openInner.scrollHeight;
  openBody.style.maxHeight = anterior;
  return altura;
}

function syncOpenHeight() {
  if (!openBody || !openInner) return;
  if (openBody.style.maxHeight === "none") return;
  openBody.style.maxHeight = measureOpen() + "px";
}

// Terminada a animacao, solta a trava de altura: a partir dai o card acompanha
// o conteudo sozinho, mesmo que a fonte carregue atrasada ou o texto reflua.
function liberarAltura(body) {
  function fim(ev) {
    if (ev.propertyName !== "max-height") return;
    body.removeEventListener("transitionend", fim);
    if (openBody === body) body.style.maxHeight = "none";
  }
  body.addEventListener("transitionend", fim);
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(syncOpenHeight);
}

        slab.textContent = "Mensagem pronta";
        const scopy = document.createElement("button");
        scopy.className = "snippet-copy";
        scopy.type = "button";
        scopy.textContent = "Copiar";
        scopy.addEventListener("click", function(ev) {
          ev.stopPropagation();
          navigator.clipboard.writeText(s.snippet).then(function() {
            scopy.textContent = "Copiado ✓";
            scopy.classList.add("is-copied");
            setTimeout(function() { scopy.textContent = "Copiar"; scopy.classList.remove("is-copied"); }, 2000);
          });
        });
        shdr.appendChild(slab);
        shdr.appendChild(scopy);
        const stxt = document.createElement("pre");
        stxt.className = "snippet-text";
        stxt.textContent = s.snippet;
        box.appendChild(shdr);
        box.appendChild(stxt);
        inner.appendChild(box);
      }

      if (s.missing && s.missing.length > 0) {
        const mnote = document.createElement("div");
        mnote.className = "step-pending-note";
        mnote.textContent = "Material ainda sem link: " + s.missing.join(" · ") + ". Solicite à liderança.";
        inner.appendChild(mnote);
      }

      if (s.pending) {
        const note = document.createElement("div");
        note.className = "step-pending-note";
        note.textContent = "Os vídeos serão adicionados assim que gravados. Aguarde a notificação da liderança.";
        inner.appendChild(note);
      } else {
        const btn = document.createElement("button");
        btn.className = "mark-btn" + (done[i] ? " is-done-btn" : "");
        btn.textContent = done[i] ? "✓ Concluído — desfazer" : "Marcar como concluído";
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          done[i] = !done[i];
          save();
          updateProgress();
          renderSteps();
        });
        inner.appendChild(btn);
      }

      body.appendChild(inner);

      if (openIdx === i) {
        openBody = body;
        openInner = inner;
      }

      hdr.addEventListener("click", function() {
        openIdx = openIdx === i ? -1 : i;
        renderSteps();
      });

      card.appendChild(hdr);
      card.appendChild(body);
      container.appendChild(card);
    });
  });

  updateProgress();

  if (openBody) {
    const body = openBody;
    // Sincrono: requestAnimationFrame nao roda com a aba oculta e o card
    // ficaria aberto e vazio, preso no max-height:0 do CSS.
    body.style.maxHeight = measureOpen() + "px";
    liberarAltura(body);
    // Rede de seguranca: sem a transicao (aba oculta, prefers-reduced-motion)
    // o transitionend nunca dispara e a altura ficaria travada na medida.
    setTimeout(function() {
      if (openBody === body) body.style.maxHeight = "none";
    }, 500);
  }
}

window.addEventListener("resize", syncOpenHeight);

renderSteps();
</script>
</body>
</html>
